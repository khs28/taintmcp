name: Publish to npm

# Manual only: publishing is a deliberate act, not something that should
# happen automatically on every push. Trigger it from the Actions tab
# (or via the API) when you're ready to ship a release.
on:
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test (scripted demos, no API key needed)
        run: |
          npm run demo
          npm run demo:m2
          npm run demo:m4

      - name: Publish packages/gateway to npm
        working-directory: packages/gateway
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
