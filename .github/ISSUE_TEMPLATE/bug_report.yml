name: Bug report
description: Something in taintmcp isn't working as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. If the bug is a way to bypass one of taintmcp's checks, please **do not** open a public issue; follow [SECURITY.md](https://github.com/khs28/taintmcp/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The command you ran, your config file (with secrets removed), and the MCP server you were wrapping if it is public.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: taintmcp version
      placeholder: "output of `taintmcp --version`"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: "e.g. Node 22.12.0 on macOS 15"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: shell
